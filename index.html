<script>

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => {

const sellerContainer = document.getElementById("topSellerContainer");
const categoryGrid = document.getElementById("categoryGrid");

let categories = new Set();

// CLEAN FUNCTION (handles spaces + case issues)
const clean = (value) => (value || "").toString().trim().toLowerCase();

// STEP 1: FILTER VERIFIED + APPROVED
const verifiedSellers = data.filter(seller => 
  clean(seller["Approved"]) === "yes" &&
  clean(seller["Verified"]) === "yes"
);

// STEP 2: LIMIT TO 5
const top5 = verifiedSellers.slice(0, 5);

// DEBUG (optional - remove later)
console.log("Total verified sellers:", verifiedSellers.length);

// STEP 3: RENDER SELLERS
top5.forEach(seller => {

  let logo = seller["Logo"] || "https://via.placeholder.com/50";

  sellerContainer.innerHTML += `

  <div class="topSellerCard">

    <img src="${logo}">

    <div class="topSellerCategory">${seller["Category"] || ""}</div>

    <div class="topSellerName">${seller["Business Name"] || "Unknown"}</div>

    <a class="topSellerButton" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
      View Seller
    </a>

  </div>

  `;

});

// STEP 4: BUILD CATEGORY GRID (ALL APPROVED SELLERS)
data.forEach(seller => {

  if(clean(seller["Approved"]) === "yes"){
    if(seller["Category"]){
      categories.add(seller["Category"]);
    }
  }

});

// STEP 5: RENDER CATEGORIES
categories.forEach(cat => {

  categoryGrid.innerHTML += `

  <div class="categoryCard"
    onclick="window.location='sellers.html?category=${encodeURIComponent(cat)}'">

    ${cat}

  </div>

  `;

});

})
.catch(err => {
  console.error("Error loading data:", err);
});

</script>
