<!DOCTYPE html>
<html>

<head>

<title>Seller Profile - SellerAtlas</title>

<style>

body{
font-family:Arial;
margin:0;
background:#F4F7F6;
}

header{
background:#1F7A63;
color:white;
padding:15px 30px;
}

nav a{
color:white;
margin-right:20px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

.profileCard{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:center;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.category{
color:#8FB339;
font-weight:bold;
margin-bottom:10px;
}

.name{
font-size:28px;
font-weight:bold;
}

.badge{
background:#8FB339;
color:white;
padding:5px 10px;
border-radius:6px;
font-size:12px;
margin-left:6px;
}

.links{
margin-top:25px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
}

.button{
background:#1F7A63;
color:white;
padding:10px 16px;
border-radius:6px;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<h2>SellerAtlas</h2>

<nav>
<a href="index.html">Home</a>
<a href="sellers.html">Browse Sellers</a>
<a href="submit.html">List Your Business</a>
</nav>

</header>

<div class="container">

<div id="profileContainer"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const sellerName = params.get("name");

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("profileContainer");

data.forEach(seller => {

if(seller["Business Name"] === sellerName){

let verifiedBadge = "";
if(seller["Verified"] === "Yes"){
verifiedBadge = `<span class="badge">GST Verified</span>`;
}

let instagram = seller["Instagram Link"];
let amazon = seller["Amazon Link"];
let flipkart = seller["Flipkart Link"];
let myntra = seller["Myntra Link"];
let website = seller["Business Website Link"];

container.innerHTML = `

<div class="profileCard">

<img src="${seller["Logo"]}" class="logo">

<div class="category">${seller["Category"]}</div>

<div class="name">
${seller["Business Name"]} ${verifiedBadge}
</div>

<div class="links">

${instagram ? `<a class="button" href="${instagram}" target="_blank">Instagram</a>` : ""}

${amazon ? `<a class="button" href="${amazon}" target="_blank">Amazon</a>` : ""}

${flipkart ? `<a class="button" href="${flipkart}" target="_blank">Flipkart</a>` : ""}

${myntra ? `<a class="button" href="${myntra}" target="_blank">Myntra</a>` : ""}

${website ? `<a class="button" href="${website}" target="_blank">Website</a>` : ""}

</div>

</div>

`;

}

});

});

</script>

</body>

</html>
