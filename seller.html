<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seller Details - SellerAtlas</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f7f6;
}

/* NAVBAR */
.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navContainer{
max-width:1200px;
margin-left:0;
margin-right:auto;
padding-left:20px;
display:flex;
align-items:center;
gap:30px;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

.logo{
height:38px;
}

/* PAGE */
.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

/* HEADER */
.sellerHeader{
display:flex;
gap:15px;
align-items:center;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerLogo{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-size:22px;
font-weight:bold;
}

.category{
font-size:13px;
color:#8FB339;
font-weight:bold;
}

/* BADGES */
.badges{
margin-top:6px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.badge{
background:#1F7A63;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.gstBadge{
background:#e6f5ef;
color:#1F7A63;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

/* ACTION BUTTONS */
.actions{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.button{
background:#1F7A63;
color:white;
padding:8px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* SECTION */
.section{
background:white;
margin-top:20px;
padding:18px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.section h3{
margin-top:0;
}

/* INFO GRID */
.infoGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.infoItem{
font-size:14px;
}

/* DECISION */
.decision{
margin-top:10px;
font-size:14px;
}

/* RELATED SELLERS */
.relatedGrid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:15px;
margin-top:10px;
}

.relatedCard{
background:#f9f9f9;
padding:12px;
border-radius:8px;
display:flex;
gap:10px;
align-items:center;
cursor:pointer;
}

.relatedCard img{
width:40px;
height:40px;
border-radius:50%;
}

.relatedName{
font-size:14px;
font-weight:bold;
}

footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}

/* MOBILE */
@media (max-width:768px){

.relatedGrid{
grid-template-columns:1fr;
}

.infoGrid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header class="navbar">
<div class="navContainer">
<a href="/"><img src="/logo.png" class="logo"></a>
<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">

<div id="sellerContent"></div>

</div>

<footer>
<p>SellerAtlas © 2026</p>
</footer>

<script>

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

function clean(val){
return (val || "").toString().trim();
}

const params = new URLSearchParams(window.location.search);
const sellerName = params.get("name");

fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("sellerContent");

const seller = data.find(s =>
clean(s["Business Name"]).toLowerCase() === clean(sellerName).toLowerCase()
);

if(!seller){
container.innerHTML = "<p>Seller not found</p>";
return;
}

let logo = seller["Logo"] || "https://via.placeholder.com/60";

let verified = seller["Verified"] === "Yes" ? `<span class="badge">✔ Verified</span>` : "";
let gst = seller["GST Verified"] === "Yes" ? `<span class="gstBadge">✔ GST Verified</span>` : "";

let website = seller["Website"];
let instagram = seller["Instagram Link"];
let amazon = seller["Amazon Link"];
let flipkart = seller["Flipkart Link"];
let myntra = seller["Myntra Link"];

let rating = seller["Google Rating"];
let reviews = seller["Reviews Count"];
let ratingHTML = rating ? `⭐ ${rating} (${reviews || 0} reviews)` : "";

/* RELATED SELLERS (same category) */
let related = data.filter(s =>
clean(s["Category"]).toLowerCase() === clean(seller["Category"]).toLowerCase() &&
clean(s["Business Name"]).toLowerCase() !== clean(seller["Business Name"]).toLowerCase() &&
clean(s["Approved"]) === "yes"
).slice(0,4);

let relatedHTML = "";

related.forEach(r => {

let rLogo = r["Logo"] || "https://via.placeholder.com/40";

relatedHTML += `
<div class="relatedCard"
onclick="window.location='seller.html?name=${encodeURIComponent(r["Business Name"])}'">

<img src="${rLogo}">
<div class="relatedName">${r["Business Name"]}</div>

</div>
`;

});

container.innerHTML = `

<div class="sellerHeader">

<img src="${logo}" class="sellerLogo">

<div>
<div class="sellerName">${seller["Business Name"]}</div>
<div class="category">${seller["Category"] || ""}</div>

<div>${ratingHTML}</div>

<div class="badges">
${verified}
${gst}
</div>

<div class="actions">
${website ? `<a href="${website}" target="_blank" class="button">Website</a>` : ""}
${instagram ? `<a href="${instagram}" target="_blank" class="button">Instagram</a>` : ""}
${amazon ? `<a href="${amazon}" target="_blank" class="button">Amazon</a>` : ""}
${flipkart ? `<a href="${flipkart}" target="_blank" class="button">Flipkart</a>` : ""}
${myntra ? `<a href="${myntra}" target="_blank" class="button">Myntra</a>` : ""}
</div>

</div>

</div>


<div class="section">
<h3>Buying Info</h3>

<div class="infoGrid">
<div class="infoItem"><strong>Price:</strong> ${seller["Price Range"] || "N/A"}</div>
<div class="infoItem"><strong>COD:</strong> ${seller["COD Available"] || "N/A"}</div>
<div class="infoItem"><strong>Returns:</strong> ${seller["Return Policy"] || "N/A"}</div>
<div class="infoItem"><strong>Shipping:</strong> ${seller["International Shipping"] || "N/A"}</div>
</div>

</div>


<div class="section">
<h3>Who is this for?</h3>

<div class="decision">
<strong>Best for:</strong> ${seller["Best For"] || "N/A"}
</div>

<div class="decision">
<strong>Not ideal for:</strong> ${seller["Not Ideal For"] || "N/A"}
</div>

</div>


<div class="section">
<h3>Similar Sellers</h3>

<div class="relatedGrid">
${relatedHTML || "<p>No similar sellers found</p>"}
</div>

</div>

`;

});

</script>

</body>
</html>
