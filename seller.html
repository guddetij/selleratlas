<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seller Details - SellerAtlas</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f7f6;
}

/* NAVBAR */
.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navContainer{
max-width:1200px;
margin-left:0;
margin-right:auto;
padding-left:20px;
display:flex;
align-items:center;
gap:30px;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

.logo{
height:38px;
}

/* PAGE */
.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

/* HEADER */
.sellerHeader{
display:flex;
gap:15px;
align-items:flex-start;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerLogo{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-size:22px;
font-weight:bold;
}

.category{
font-size:13px;
color:#8FB339;
font-weight:bold;
margin-top:2px;
}

.description{
font-size:14px;
margin-top:6px;
color:#444;
}

/* BADGES */
.badges{
margin-top:8px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.badge{
background:#1F7A63;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.gstBadge{
background:#e6f5ef;
color:#1F7A63;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

/* TRUST */
.trust{
margin-top:8px;
font-size:13px;
color:#555;
}

/* ACTIONS */
.actions{
margin-top:12px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.button{
background:#1F7A63;
color:white;
padding:7px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* PRODUCT TAGS */
.tags{
margin-top:12px;
display:flex;
flex-wrap:wrap;
gap:8px;
}

.tag{
background:#f1f1f1;
padding:6px 10px;
border-radius:20px;
font-size:12px;
}

/* SECTION */
.section{
background:white;
margin-top:20px;
padding:18px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.section h3{
margin-top:0;
}

/* INFO GRID */
.infoGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.infoItem{
font-size:14px;
}

/* RELATED */
.relatedGrid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:15px;
margin-top:10px;
}

.relatedCard{
background:#f9f9f9;
padding:12px;
border-radius:8px;
display:flex;
gap:10px;
align-items:center;
cursor:pointer;
}

.relatedCard img{
width:40px;
height:40px;
border-radius:50%;
}

.relatedName{
font-size:14px;
font-weight:bold;
}

footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}

.actions{
display:flex;
gap:10px;
margin-top:12px;
flex-wrap:wrap;
}

.iconBtn{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
background:#f1f1f1;
transition:0.2s;
}

.iconBtn img{
width:20px;
height:20px;
object-fit:contain;
}

.iconBtn:hover{
transform:scale(1.05);
}

/* BRAND COLORS */
.instagram{
background:#ffe5ec;
}

.amazon{
background:#fff4e5;
}

.flipkart{
background:#e6f0ff;
}

.myntra{
background:#ffe6f3;
}  
  
@media (max-width:768px){
.infoGrid{
grid-template-columns:1fr;
}
.relatedGrid{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<header class="navbar">
<div class="navContainer">
<a href="/"><img src="/logo.png" class="logo"></a>
<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">
<div id="sellerContent"></div>
</div>

<footer>
<p>SellerAtlas © 2026</p>
</footer>

<script>

const sheetID = "17A0iSszEqDQydQX4nLY51Lua6lJprBx7X_3kV59h4n8";
const API_URL = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

const CACHE_KEY = "sellerAtlasData";
const CACHE_TIME = 5 * 60 * 1000; // 5 minutes

function clean(val){
  return (val || "").toString().trim();
}

function getSlug(name){
  return clean(name).toLowerCase().replace(/\s+/g, "-");
}

async function getData(){
  const cached = localStorage.getItem(CACHE_KEY);

  if(cached){
    const { data, timestamp } = JSON.parse(cached);
    if(Date.now() - timestamp < CACHE_TIME){
      return data;
    }
  }

  try{
    const res = await fetch(API_URL);
    const data = await res.json();

    localStorage.setItem(CACHE_KEY, JSON.stringify({
      data,
      timestamp: Date.now()
    }));

    return data;

  } catch(e){
    document.getElementById("sellerContent").innerHTML =
      "<p>⚠️ Failed to load data. Try again later.</p>";
    throw e;
  }
}

function formatWhatsApp(num){
  if(!num) return null;
  return `https://wa.me/${num.replace(/\D/g,'')}`;
}

function findSeller(data){
  const params = new URLSearchParams(window.location.search);

  const slug = params.get("slug");
  const name = params.get("name");

  return data.find(s => {
    const sellerName = clean(s["Business Name"]).toLowerCase();
    const sellerSlug = getSlug(s["Business Name"]);

    return (
      (slug && sellerSlug === slug) ||
      (name && sellerName === clean(name).toLowerCase())
    );
  });
}

function renderSeller(seller, data){

  const container = document.getElementById("sellerContent");

  let types = seller["Product Types"] ? seller["Product Types"].split(",") : [];
  let tagsHTML = types.map(t => `<div class="tag">${t.trim()}</div>`).join("");

  let verified = seller["Verified"] === "Yes"
    ? `<span class="badge">✔ Verified</span>` : "";

  let gst = seller["GST Verified"] === "Yes"
    ? `<span class="gstBadge">✔ GST Verified</span>` : "";

  let whatsapp = formatWhatsApp(seller["WhatsApp"]);

  // 🔥 PRIMARY CTA (VISIBLE)
  let ctaHTML = `
    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
      ${whatsapp ? `<a href="${whatsapp}" target="_blank" class="button">💬 Chat on WhatsApp</a>` : ""}
      ${seller["Website"] ? `<a href="${seller["Website"]}" target="_blank" class="button">🌐 Visit Website</a>` : ""}
    </div>
  `;

  // secondary icons
  let iconsHTML = `
    <div class="actions">
      ${seller["Instagram Link"] ? `<a href="${seller["Instagram Link"]}" target="_blank" class="iconBtn instagram"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg"></a>` : ""}
      ${seller["Amazon Link"] ? `<a href="${seller["Amazon Link"]}" target="_blank" class="iconBtn amazon"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/amazon.svg"></a>` : ""}
      ${seller["Flipkart Link"] ? `<a href="${seller["Flipkart Link"]}" target="_blank" class="iconBtn flipkart"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/flipkart.svg"></a>` : ""}
      ${seller["Myntra Link"] ? `<a href="${seller["Myntra Link"]}" target="_blank" class="iconBtn myntra"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Myntra_logo.png/512px-Myntra_logo.png"></a>` : ""}
    </div>
  `;

  // RELATED SELLERS
  let currentCategory = clean(seller["Category"]).toLowerCase();

  let related = data.filter(s => {
    let cat = clean(s["Category"]).toLowerCase();
    return cat === currentCategory &&
      clean(s["Business Name"]) !== clean(seller["Business Name"]) &&
      clean(s["Approved"]).toLowerCase() === "yes";
  }).slice(0,4);

  let relatedHTML = related.map(r => `
    <div class="relatedCard"
    onclick="window.location='seller.html?name=${encodeURIComponent(r["Business Name"])}'">
      <img src="${r["Logo"] || "https://via.placeholder.com/40"}">
      <div class="relatedName">${r["Business Name"]}</div>
    </div>
  `).join("");

  container.innerHTML = `

  <div class="sellerHeader">

    <img src="${seller["Logo"] || "https://via.placeholder.com/60"}" class="sellerLogo">

    <div>

      <div class="sellerName">${seller["Business Name"]}</div>
      <div class="category">${seller["Category"] || ""}</div>

      <div class="description">${seller["Short Description"] || ""}</div>

      <div class="badges">${verified}${gst}</div>

      ${ctaHTML}

      ${iconsHTML}

      <div class="tags">${tagsHTML}</div>

    </div>

  </div>

  <div class="section">
    <h3>Buying Info</h3>
    <div class="infoGrid">
      <div><strong>Price:</strong> ${seller["Price Range"] || "N/A"}</div>
      <div><strong>COD:</strong> ${seller["COD Available"] || "N/A"}</div>
      <div><strong>Returns:</strong> ${seller["Return Policy"] || "N/A"}</div>
      <div><strong>Shipping:</strong> ${seller["International Shipping"] || "N/A"}</div>
    </div>
  </div>

  <div class="section">
    <h3>Similar Sellers</h3>
    <div class="relatedGrid">
      ${relatedHTML || "<p>No similar sellers found</p>"}
    </div>
  </div>
  `;
}

(async function(){

  const data = await getData();
  const seller = findSeller(data);

  if(!seller){
    document.getElementById("sellerContent").innerHTML =
      "<p>Seller not found</p>";
    return;
  }

  renderSeller(seller, data);

})();

</script>
</body>
</html>
