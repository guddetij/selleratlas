<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<link rel="icon" href="/favicon.png">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f4f7f6;
}

/* NAVBAR */
.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navContainer{
display:flex;
align-items:center;
gap:30px;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

.logo{
height:38px;
}

/* PAGE */
.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

/* INTENT HEADER */
.intentHeader{
background:white;
padding:12px;
border-radius:8px;
margin-bottom:15px;
font-size:14px;
display:none;
}

/* SEARCH */
.searchBox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

/* CATEGORY */
#categoryContainer{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.category{
background:white;
padding:8px 14px;
border-radius:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
cursor:pointer;
font-size:13px;
}

/* GRID */
#sellerContainer{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

/* CARD */
.sellerCard{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerTop{
display:flex;
gap:10px;
align-items:center;
}

.sellerLogo{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-weight:bold;
font-size:16px;
}

.categoryLabel{
font-size:12px;
color:#8FB339;
}

/* TRUST */
.trustLine{
font-size:12px;
color:#666;
margin-top:2px;
}

/* BEST FOR */
.bestFor{
font-size:13px;
margin-top:8px;
color:#555;
}

/* ACTION */
.cardActions{
display:flex;
justify-content:flex-end;
margin-top:12px;
}

.ctaButton{
background:#1F7A63;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* FOOTER */
footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}

@media(max-width:768px){
#sellerContainer{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<header class="navbar">
<div class="navContainer">
<img src="/logo.png" class="logo">

<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">

<div id="intentHeader" class="intentHeader"></div>

<div class="searchBox">
<input type="text" id="searchInput" placeholder="Search sellers..." onkeyup="searchSellers()">
</div>

<div id="categoryContainer"></div>

<div id="sellerContainer"></div>

</div>

<footer>
<p>SellerAtlas © 2026</p>
</footer>

<script>

const url = "https://opensheet.elk.sh/17A0iSszEqDQydQX4nLY51Lua6lJprBx7X_3kV59h4n8/Sheet1";

const params = new URLSearchParams(window.location.search);
const intent = params.get("intent");

/* SHOW INTENT */
if(intent){
const header = document.getElementById("intentHeader");
header.style.display = "block";
header.innerText = `Showing sellers for: ${intent.toUpperCase()}`;
}

function clean(val){
return (val || "").toString().trim();
}

/* SEARCH */
function searchSellers(){
let input = document.getElementById("searchInput").value.toLowerCase();
let cards = document.getElementsByClassName("sellerCard");

for(let i=0;i<cards.length;i++){
let text = cards[i].innerText.toLowerCase();
cards[i].style.display = text.includes(input) ? "" : "none";
}
}

/* FILTER */
function filterCategory(cat){
let cards = document.getElementsByClassName("sellerCard");

for(let i=0;i<cards.length;i++){
let text = cards[i].innerText.toLowerCase();
cards[i].style.display = text.includes(cat.toLowerCase()) ? "" : "none";
}
}

/* TRUST LINE */
function getTrustLine(seller){
let followers = (seller["Instagram Followers"] || "").toString().trim();
let verified = (seller["Verified"] || "").toLowerCase();

let parts = [];

if(followers){
parts.push(`👥 ${followers}`);
}

if(verified === "yes"){
parts.push("✔ Verified");
}

if(parts.length === 0){
return "Trusted seller";
}

return parts.join(" • ");
}

/* BEST FOR GENERATOR */
function generateBestFor(seller){

let bestFor = (seller["Best For"] || "").toLowerCase().trim();

if(bestFor && !bestFor.includes("various") && bestFor.length > 5){
return seller["Best For"];
}

let category = (seller["Category"] || "").toLowerCase();

if(category.includes("jewellery")){
return "Gifting & special occasions";
}

if(category.includes("apparel") || category.includes("clothing")){
return "Daily wear & styling";
}

if(category.includes("accessories")){
return "Affordable everyday accessories";
}

return "Popular choice for buyers";
}

/* FETCH DATA */
fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("sellerContainer");
const categoryContainer = document.getElementById("categoryContainer");

let categories = new Set();

data.forEach(seller => {

let approved = clean(seller["Approved"]).toLowerCase();
if(approved !== "yes") return;

let name = clean(seller["Business Name"]);
if(!name) return;

let category = clean(seller["Category"]);
let logo = clean(seller["Logo"]) || "https://via.placeholder.com/40";

categories.add(category);

container.innerHTML += `
<div class="sellerCard">

<div class="sellerTop">
<img src="${logo}" class="sellerLogo">

<div>
<div class="sellerName">${name}</div>
<div class="categoryLabel">${category}</div>
<div class="trustLine">${getTrustLine(seller)}</div>
</div>
</div>

<div class="bestFor">
💡 Best for: ${generateBestFor(seller)}
</div>

<div class="cardActions">
<a class="ctaButton"
href="seller.html?name=${encodeURIComponent(name)}&intent=${intent || ""}">
💬 Contact Seller
</a>
</div>

</div>
`;

});

/* CATEGORY BUTTONS */
categoryContainer.innerHTML = `<div class="category" onclick="location.reload()">All</div>`;

categories.forEach(cat=>{
categoryContainer.innerHTML += `
<div class="category" onclick="filterCategory('${cat}')">
${cat}
</div>
`;
});

});

</script>

</body>
</html>
