<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f7f6;
}

/* NAVBAR FIXED LEFT */
.navContainer{
max-width:1200px;
margin-left:0;
margin-right:auto;
padding-left:20px;
display:flex;
align-items:center;
gap:30px;
}

.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

.logo{
height:38px;
}

/* PAGE */
.container{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

/* SEARCH */
.searchBox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

/* SELLER CARD */
.sellerCard{
background:white;
padding:16px;
border-radius:10px;
margin-top:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerTop{
display:flex;
gap:15px;
align-items:center;
}

.sellerLogo{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-size:18px;
font-weight:bold;
}

.categoryLabel{
font-size:12px;
color:#8FB339;
font-weight:bold;
}

.sellerHint{
font-size:13px;
color:#555;
margin-top:6px;
}

.linkButtons{
margin-top:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.linkButton{
background:#1F7A63;
color:white;
padding:6px 12px;
border-radius:6px;
text-decoration:none;
font-size:12px;
}

.viewButton{
display:inline-block;
margin-top:10px;
background:#1F7A63;
color:white;
padding:8px 14px;
border-radius:6px;
text-decoration:none;
}

footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}
.cardActions{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:12px;
}

.iconButton{
width:36px;
height:36px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#f1f1f1;
}

.iconButton img{
width:18px;
height:18px;
}

.viewButton{
background:#1F7A63;
color:white;
padding:8px 16px;
border-radius:6px;
text-decoration:none;
font-size:14px;
}
</style>
</head>

<body>

<header class="navbar">
<div class="navContainer">
<a href="/"><img src="/logo.png" class="logo"></a>
<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">

<h2>All Sellers</h2>

<div class="searchBox">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchSellers()">
</div>

<div id="sellerContainer"></div>

</div>

<footer>
<p>SellerAtlas © 2026</p>
</footer>

<script>

/* SEARCH */
function searchSellers(){
let input = document.getElementById("searchInput").value.toLowerCase();
let sellers = document.getElementsByClassName("sellerCard");

for(let i=0;i<sellers.length;i++){
let text = sellers[i].innerText.toLowerCase();
sellers[i].style.display = text.includes(input) ? "" : "none";
}
}

/* FETCH */
const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

function clean(val){
return (val || "").toString().trim().toLowerCase();
}

fetch(url)
.then(res => res.json())
.then(data => {

const sellerContainer = document.getElementById("sellerContainer");

data.forEach(seller => {

if(clean(seller["Approved"]) !== "yes") return;

let logo = seller["Logo"] || "https://via.placeholder.com/50";

let instagram = seller["Instagram Link"];
let website = seller["Website"];

sellerContainer.innerHTML += `
<div class="sellerCard">

  <div class="sellerTop">
    <img src="${logo}" class="sellerLogo">

    <div>
      <div class="sellerName">${seller["Business Name"]}</div>
      <div class="categoryLabel">${seller["Category"] || ""}</div>
    </div>
  </div>

  <div class="sellerHint">
    View pricing • COD • returns • shipping →
  </div>

  <div class="linkButtons">
    ${website ? `<a class="linkButton" href="${website}" target="_blank">Website</a>` : ""}
    ${instagram ? `<a class="linkButton" href="${instagram}" target="_blank">Instagram</a>` : ""}
  </div>

  <a class="viewButton" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
    View Details
  </a>

</div>
`;

});

});

</script>

</body>
</html>
