<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f4f7f6;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* FLOW */
.flowBox{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.flowTitle{
font-weight:bold;
margin-bottom:10px;
}

.flowOptions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.flowBtn{
padding:8px 14px;
background:#eee;
border-radius:20px;
cursor:pointer;
font-size:13px;
}

.flowBtn:hover{
background:#1F7A63;
color:white;
}

.backBtn{
margin-top:10px;
font-size:12px;
cursor:pointer;
color:#1F7A63;
}

/* SEARCH */
.searchBox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

/* GRID */
#sellerContainer{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

/* CARD */
.sellerCard{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerTop{
display:flex;
gap:10px;
align-items:center;
}

.sellerLogo{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-weight:bold;
}

.categoryLabel{
font-size:12px;
color:#8FB339;
}

.trustLine{
font-size:12px;
color:#666;
margin-top:2px;
}

.bestFor{
margin-top:8px;
font-size:13px;
}

.cardActions{
margin-top:10px;
text-align:right;
}

.ctaButton{
background:#1F7A63;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

@media(max-width:768px){
#sellerContainer{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<div class="container">

<div id="selectionFlow"></div>

<div class="searchBox">
<input type="text" id="searchInput" placeholder="Search sellers..." onkeyup="searchSellers()">
</div>

<div id="sellerContainer"></div>

</div>

<script>

const url = "https://opensheet.elk.sh/17A0iSszEqDQydQX4nLY51Lua6lJprBx7X_3kV59h4n8/Sheet1";

let globalData = [];

// FLOW STATE
let flowStep = 0;
let selectedCategory = null;
let selectedOccasion = null;

const occasionMap = {
  "Jewellery": ["Everyday", "Office", "Party", "Bridal"],
  "Apparel": ["Daily wear", "Office wear", "Party wear", "Ethnic"],
  "Accessories": ["Casual", "Trendy", "Budget", "Gifting"]
};

function renderFlow(){

  const container = document.getElementById("selectionFlow");

  if(flowStep === 0){
    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">What are you looking for?</div>
        <div class="flowOptions">
          <div class="flowBtn" onclick="selectCategory('Jewellery')">Jewellery</div>
          <div class="flowBtn" onclick="selectCategory('Apparel')">Apparel</div>
          <div class="flowBtn" onclick="selectCategory('Accessories')">Accessories</div>
        </div>
      </div>
    `;
  }

  if(flowStep === 1){
    let options = occasionMap[selectedCategory] || [];

    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">Occasion?</div>
        <div class="flowOptions">
          ${options.map(o => `<div class="flowBtn" onclick="selectOccasion('${o}')">${o}</div>`).join("")}
        </div>
        <div class="backBtn" onclick="goBack()">← Back</div>
      </div>
    `;
  }

  if(flowStep === 2){
    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">
          Showing: ${selectedCategory} → ${selectedOccasion}
        </div>
        <div class="backBtn" onclick="goBack()">← Change</div>
      </div>
    `;

    renderFilteredSellers();
  }
}

function selectCategory(cat){
  selectedCategory = cat;
  flowStep = 1;
  renderFlow();
}

function selectOccasion(occ){
  selectedOccasion = occ;
  flowStep = 2;
  renderFlow();
}

function goBack(){
  flowStep--;
  renderFlow();
}

/* SEARCH */
function searchSellers(){
let input = document.getElementById("searchInput").value.toLowerCase();
let cards = document.getElementsByClassName("sellerCard");

for(let i=0;i<cards.length;i++){
let text = cards[i].innerText.toLowerCase();
cards[i].style.display = text.includes(input) ? "" : "none";
}
}

/* TRUST */
function getTrustLine(seller){
let followers = seller["Instagram Followers"];
let verified = (seller["Verified"] || "").toLowerCase();

let parts = [];

if(followers){
parts.push(`👥 ${followers}`);
}

if(verified === "yes"){
parts.push("✔ Verified");
}

return parts.join(" • ") || "Trusted seller";
}

/* BEST FOR */
function generateBestFor(seller){

let bestFor = (seller["Best For"] || "").toLowerCase();

if(bestFor && !bestFor.includes("various") && bestFor.length > 5){
return seller["Best For"];
}

let category = (seller["Category"] || "").toLowerCase();

if(category.includes("jewellery")){
return "Gifting & special occasions";
}

if(category.includes("apparel")){
return "Daily wear & styling";
}

if(category.includes("accessories")){
return "Affordable everyday accessories";
}

return "Popular choice";
}

/* MATCH */
function getMatchScore(seller){

let score = 0;

let category = (seller["Category"] || "").toLowerCase();
let bestFor = (seller["Best For"] || "").toLowerCase();

if(category.includes(selectedCategory.toLowerCase())){
score += 50;
}

if(bestFor.includes(selectedOccasion.toLowerCase())){
score += 30;
}

return score;
}

function renderFilteredSellers(){

const container = document.getElementById("sellerContainer");

let ranked = globalData.map(s => ({
...s,
score: getMatchScore(s)
}));

ranked = ranked
.filter(s => s.score > 0)
.sort((a,b) => b.score - a.score)
.slice(0,5);

container.innerHTML = "";

ranked.forEach(seller => {

container.innerHTML += `
<div class="sellerCard">

<div class="sellerTop">
<img src="${seller["Logo"] || "https://via.placeholder.com/40"}" class="sellerLogo">

<div>
<div class="sellerName">${seller["Business Name"]}</div>
<div class="categoryLabel">${seller["Category"]}</div>
<div class="trustLine">${getTrustLine(seller)}</div>
</div>
</div>

<div class="bestFor">
💡 Best for: ${generateBestFor(seller)}
</div>

<div style="font-size:12px; color:#1F7A63; margin-top:5px;">
🔥 ${seller.score}% Match
</div>

<div class="cardActions">
<a class="ctaButton"
href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
💬 Contact Seller
</a>
</div>

</div>
`;
});

}

/* INITIAL LOAD */
fetch(url)
.then(res => res.json())
.then(data => {
globalData = data;
renderFlow(); // 👈 START HERE
});

</script>

</body>
</html>
