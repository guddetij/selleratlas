<script>

/* SEARCH */

function searchSellers(){
let input = document.getElementById("searchInput").value.toLowerCase();
let sellers = document.getElementsByClassName("sellerCard");

for(let i=0;i<sellers.length;i++){
let text = sellers[i].innerText.toLowerCase();
sellers[i].style.display = text.includes(input) ? "" : "none";
}
}

/* CATEGORY PARAM (SAFE) */

const params = new URLSearchParams(window.location.search);
let selectedCategory = params.get("category");

/* Normalize category */
if(selectedCategory){
selectedCategory = selectedCategory.trim().toLowerCase();
}

/* FETCH */

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => {

const sellerContainer = document.getElementById("sellerContainer");
const categoryContainer = document.getElementById("categoryContainer");

let categories = new Set();

data.forEach(seller => {

try {

/* APPROVED FILTER */
let approved = (seller["Approved"] || "").trim();
if(approved !== "Yes") return;

/* CATEGORY CLEAN */
let category = (seller["Category"] || "").trim();
let categoryLower = category.toLowerCase();

/* 🔥 SAFE CATEGORY FILTER */
if(selectedCategory && selectedCategory !== categoryLower){
return;
}

categories.add(category);

/* BADGES */
let verifiedBadge = "";
let gstBadge = "";

if((seller["Verified"] || "").trim() === "Yes"){
verifiedBadge = `<span class="badge">✔ Verified</span>`;
}

if((seller["GST Verified"] || "").trim() === "Yes"){
gstBadge = `<span class="gstBadge">🧾 GST Verified</span>`;
}

/* LOGO */
let logo = seller["Logo"] || "https://via.placeholder.com/50";

/* RENDER */
sellerContainer.innerHTML += `
<div class="sellerCard">

<img class="sellerLogo" src="${logo}">

<div class="sellerInfo">
<div class="sellerName">
${seller["Business Name"]} ${verifiedBadge} ${gstBadge}
</div>

<div class="categoryLabel">${category}</div>

<div class="sellerHandle">
@${seller["Instagram Username"] || ""}
</div>
</div>

<a class="button" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
View Seller
</a>

</div>
`;

} catch(e){
console.log("Error in seller row:", seller);
}

});

/* CATEGORY BUTTONS */

categoryContainer.innerHTML += `
<div class="category" onclick="window.location='sellers.html'">All</div>
`;

categories.forEach(cat => {

categoryContainer.innerHTML += `
<div class="category"
onclick="window.location='sellers.html?category=${encodeURIComponent(cat)}'">
${cat}
</div>
`;

});

});

</script>
