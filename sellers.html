<!DOCTYPE html>
<html>

<head>

<title>Browse Sellers - SellerAtlas</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f7f6;
}

header{
background:#8FB339;
color:white;
padding:20px;
}

nav a{
color:white;
margin-right:20px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

h2{
margin-top:30px;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.category{
background:#e9e9e9;
padding:14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.searchbox{
margin-top:15px;
}

.searchbox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

.sellerCard{
margin-top:20px;
padding:15px 0;
border-bottom:1px solid #ddd;
}

.categoryLabel{
color:#8FB339;
font-size:12px;
font-weight:bold;
}

.sellerName{
font-size:20px;
font-weight:bold;
}

.sellerHandle{
color:#777;
}

.button{
background:#1F7A63;
color:white;
padding:8px 14px;
border-radius:6px;
text-decoration:none;
display:inline-block;
margin-top:8px;
}

.badge{
background:#e6f5ef;
color:#1F7A63;
padding:3px 7px;
border-radius:5px;
font-size:11px;
margin-left:5px;
}

</style>

</head>

<body>

<header>

<h1>SellerAtlas</h1>

<nav>
<a href="index.html">Home</a>
<a href="sellers.html">Browse Sellers</a>
<a href="submit.html">List Your Business</a>
</nav>

</header>

<div class="container">

<h2>Browse Categories</h2>

<div class="categories">

<div class="category" onclick="filterCategory('Women')">👗 Women's Wear</div>
<div class="category" onclick="filterCategory('Men')">👕 Men's Wear</div>
<div class="category" onclick="filterCategory('Shoes')">👟 Shoes</div>
<div class="category" onclick="filterCategory('Jewelry')">💍 Jewelry</div>
<div class="category" onclick="filterCategory('Kids')">🧸 Kids Clothing</div>
<div class="category" onclick="filterCategory('Home')">🏠 Home</div>
<div class="category" onclick="filterCategory('Books')">📚 Books</div>
<div class="category" onclick="filterCategory('Toys')">🧸 Toys</div>
<div class="category" onclick="filterCategory('Sports')">🏋️ Sports/Fitness</div>
<div class="category" onclick="filterCategory('Beauty')">💄 Beauty</div>

</div>

<h2>All Sellers</h2>

<p>Search by Instagram username/brand name</p>

<div class="searchbox">

<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchSellers()">

</div>

<div id="sellerContainer"></div>

</div>


<script>

/* SEARCH FUNCTION */

function searchSellers(){

let input = document.getElementById("searchInput").value.toLowerCase();

let sellers = document.getElementsByClassName("sellerCard");

for (let i = 0; i < sellers.length; i++){

let text = sellers[i].innerText.toLowerCase();

if(text.includes(input)){
sellers[i].style.display="";
}else{
sellers[i].style.display="none";
}

}

}

/* CATEGORY FILTER */

function filterCategory(category){

let sellers = document.getElementsByClassName("sellerCard");

for (let i = 0; i < sellers.length; i++){

let text = sellers[i].innerText;

if(text.includes(category)){
sellers[i].style.display="";
}else{
sellers[i].style.display="none";
}

}

}

</script>


<script>

/* GOOGLE SHEET DIRECTORY */

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";

const url = `https://opensheet.elk.sh/${sheetID}/Sheet2`;

fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("sellerContainer");

data.forEach(seller => {

let badge = "";

if(seller["Verified"] === "Yes"){
badge = `<span class="badge">✔ Verified</span>`;
}

let instagram = seller["Instagram Link"];

if(!instagram.startsWith("http")){
instagram = "https://" + instagram;
}

container.innerHTML += `

<div class="sellerCard">

<div class="categoryLabel">${seller["Category"]}</div>

<div class="sellerName">
${seller["Business Name"]} ${badge}
</div>

<div class="sellerHandle">
@${seller["Instagram Username"] || ""}
</div>

<a class="button" href="${instagram}" target="_blank">
Visit Instagram
</a>

</div>

`;

});

});

</script>


</body>

</html>
