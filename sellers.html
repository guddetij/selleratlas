<!DOCTYPE html>
<html>

<head>

<title>Browse Sellers - SellerAtlas</title>

<style>

body{
font-family:Arial;
margin:0;
background:#F4F7F6;
}

header{
background:#1F7A63;
color:white;
padding:20px;
}

nav a{
color:white;
margin-right:20px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

h2{
margin-top:30px;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.category{
background:white;
padding:16px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
text-align:center;
}

.searchbox{
margin-top:15px;
}

.searchbox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

.sellerCard{
margin-top:20px;
padding:15px 0;
border-bottom:1px solid #ddd;
display:flex;
gap:15px;
align-items:center;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.categoryLabel{
color:#8FB339;
font-size:12px;
font-weight:bold;
}

.sellerName{
font-size:20px;
font-weight:bold;
}

.sellerHandle{
color:#777;
}

.button{
background:#1F7A63;
color:white;
padding:8px 14px;
border-radius:6px;
text-decoration:none;
display:inline-block;
margin-top:8px;
}

.badge{
background:#8FB339;
color:white;
padding:3px 7px;
border-radius:5px;
font-size:11px;
margin-left:5px;
}

.gstBadge{
background:#e6f5ef;
color:#1F7A63;
padding:3px 7px;
border-radius:5px;
font-size:11px;
margin-left:5px;
}

</style>

</head>

<body>

<header>

<h1>SellerAtlas</h1>

<nav>
<a href="index.html">Home</a>
<a href="sellers.html">Browse Sellers</a>
<a href="submit.html">List Your Business</a>
</nav>

</header>

<div class="container">

<h2>Browse Categories</h2>

<div id="categoryContainer" class="categories"></div>

<h2>Featured Sellers</h2>

<div id="featuredContainer"></div>

<h2>All Sellers</h2>

<p>Search by Instagram username / brand name</p>

<div class="searchbox">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchSellers()">
</div>

<div id="sellerContainer"></div>

</div>

<script>

/* SEARCH FUNCTION */

function searchSellers(){

let input = document.getElementById("searchInput").value.toLowerCase();
let sellers = document.getElementsByClassName("sellerCard");

for (let i = 0; i < sellers.length; i++){

let text = sellers[i].innerText.toLowerCase();

if(text.includes(input)){
sellers[i].style.display="";
}else{
sellers[i].style.display="none";
}

}

}

/* CATEGORY FILTER */

function filterCategory(category){

let sellers = document.getElementsByClassName("sellerCard");

for (let i = 0; i < sellers.length; i++){

let sellerCategory = sellers[i].getAttribute("data-category");

if(sellerCategory === category){
sellers[i].style.display="";
}else{
sellers[i].style.display="none";
}

}

}

</script>


<script>

/* GOOGLE SHEET DIRECTORY */

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => {

const sellerContainer = document.getElementById("sellerContainer");
const featuredContainer = document.getElementById("featuredContainer");
const categoryContainer = document.getElementById("categoryContainer");

let categories = new Set();

data.forEach(seller => {

if(seller["Approved"] !== "Yes") return;

let verifiedBadge = "";
let gstBadge = "";

/* PLATFORM VERIFIED */

if(seller["Verified"] === "Yes"){
verifiedBadge = `<span class="badge">✔ Verified</span>`;
}

/* GST VERIFIED */

if(seller["GST Number"] && seller["GST Number"].length > 5){
gstBadge = `<span class="gstBadge">🧾 GST Verified</span>`;
}

let logo = seller["Logo"] || "https://via.placeholder.com/55";

/* FEATURED SELLERS */

if(seller["Featured"] === "Yes"){

featuredContainer.innerHTML += `

<div class="sellerCard" data-category="${seller["Category"]}">

<img class="logo" src="${logo}">

<div>

<div class="sellerName">
⭐ ${seller["Business Name"]} ${verifiedBadge} ${gstBadge}
</div>

<div class="categoryLabel">${seller["Category"]}</div>

<a class="button" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
View Seller
</a>

</div>

</div>

`;

}

/* ALL SELLERS */

sellerContainer.innerHTML += `

<div class="sellerCard" data-category="${seller["Category"]}">

<img class="logo" src="${logo}">

<div>

<div class="categoryLabel">${seller["Category"]}</div>

<div class="sellerName">
${seller["Business Name"]} ${verifiedBadge} ${gstBadge}
</div>

<div class="sellerHandle">
@${seller["Instagram Username"] || ""}
</div>

<a class="button" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
View Seller
</a>

</div>

</div>

`;

categories.add((seller["Category"] || "").trim());

});

/* CREATE CATEGORY BUTTONS */
/* Add "All" button first */
categoryContainer.innerHTML += `
<div class="category" onclick="filterCategory('All')">
All
</div>
`;
categories.forEach(cat => {

if(cat){

categoryContainer.innerHTML += `

<div class="category" onclick="filterCategory('${cat}')">
${cat}
</div>

`;

}

});

});

</script>

</body>
</html>
