<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f7f6;
}

/* TOP BAR */
.topBar{
background:#0e3d66;
color:white;
font-size:13px;
}

.topBarContent{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 20px;
}

.topLinks a{
color:white;
text-decoration:none;
margin-left:15px;
}

/* NAVBAR */
.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navContainer{
max-width:1200px;
margin-left:0;
margin-right:auto;
padding-left:20px;
display:flex;
align-items:center;
gap:40px;
}

.logo{
height:38px;
}

.navLinks{
display:flex;
gap:30px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

/* PAGE */
.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* FLOW */
.flowBox{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.flowTitle{
font-weight:bold;
margin-bottom:10px;
}

.flowOptions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.flowBtn{
padding:8px 14px;
background:#eee;
border-radius:20px;
cursor:pointer;
font-size:13px;
}

.flowBtn:hover{
background:#1F7A63;
color:white;
}

/* SEARCH */
.searchBox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

/* GRID */
#sellerContainer{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

/* CARD */
.sellerCard{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.sellerTop{
display:flex;
gap:10px;
align-items:center;
}

.sellerLogo{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-weight:bold;
}

.categoryLabel{
font-size:12px;
color:#8FB339;
}

.trustLine{
font-size:12px;
color:#666;
margin-top:2px;
}

.bestFor{
margin-top:8px;
font-size:13px;
}

.ctaButton{
background:#1F7A63;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* FOOTER */
footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}

footer a{
color:white;
text-decoration:none;
margin:0 10px;
}

@media(max-width:768px){
#sellerContainer{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topBar">
<div class="topBarContent">
<span>Discover trusted small businesses</span>
<div class="topLinks">
<a href="/about.html">About</a>
<a href="/privacy.html">Privacy</a>
</div>
</div>
</div>

<!-- NAVBAR -->
<header class="navbar">
<div class="navContainer">
<a href="/"><img src="/logo.png" class="logo"></a>
<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">

<!-- DECISION NUDGE -->
<div class="flowBox" style="background:#e8f5f1; border:1px solid #cde7df;">
  <div class="flowTitle">Not sure who to choose?</div>
  <div style="font-size:13px; margin-bottom:10px;">
    Answer 2 quick questions → get the best seller instantly
  </div>
  <div class="flowBtn" onclick="startGuidedFlow()" style="background:#1F7A63; color:white;">
    Find my best seller
  </div>
</div>

<div id="selectionFlow"></div>

<div class="searchBox">
<input type="text" placeholder="Search sellers...">
</div>

<div id="sellerContainer"></div>

</div>

<!-- FOOTER -->
<footer>
<p>SellerAtlas © 2026</p>
<div>
<a href="/about.html">About</a>
<a href="/privacy.html">Privacy</a>
<a href="/contact.html">Contact</a>
</div>
</footer>

<script>

/* SAME JS AS BEFORE (unchanged logic) */

const url = "https://opensheet.elk.sh/17A0iSszEqDQydQX4nLY51Lua6lJprBx7X_3kV59h4n8/Sheet1";

let globalData = [];
let flowStep = 0;
let selectedCategory = null;
let selectedOccasion = null;
let flowActive = false;

const occasionMap = {
  "Jewellery": ["Everyday", "Office", "Party", "Bridal"],
  "Apparel": ["Daily wear", "Office wear", "Party wear", "Ethnic"],
  "Accessories": ["Casual", "Trendy", "Budget", "Gifting"]
};

function startGuidedFlow(){
  flowStep = 0;
  flowActive = true;
  renderFlow();
}

function renderFlow(){

  const container = document.getElementById("selectionFlow");

  if(!flowActive){
    container.innerHTML = "";
    return;
  }

  if(flowStep === 0){
    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">Choose a category</div>
        <div class="flowOptions">
          <div class="flowBtn" onclick="selectCategory('Jewellery')">Jewellery</div>
          <div class="flowBtn" onclick="selectCategory('Apparel')">Apparel</div>
          <div class="flowBtn" onclick="selectCategory('Accessories')">Accessories</div>
        </div>
      </div>
    `;
  }

  if(flowStep === 1){
    let options = occasionMap[selectedCategory] || [];

    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">Occasion?</div>
        <div class="flowOptions">
          ${options.map(o => `<div class="flowBtn" onclick="selectOccasion('${o}')">${o}</div>`).join("")}
        </div>
      </div>
    `;
  }

  if(flowStep === 2){
    container.innerHTML = `
      <div class="flowBox">
        <div class="flowTitle">
          Best match for: ${selectedCategory} → ${selectedOccasion}
        </div>
      </div>
    `;
  }
}

function selectCategory(cat){
  selectedCategory = cat;
  flowStep = 1;
  renderFlow();
}

function selectOccasion(occ){
  selectedOccasion = occ;
  flowStep = 2;
  renderFlow();
  renderSellers();
}

function getMatchScore(seller){

if(!flowActive) return null;

let score = 0;

let category = (seller["Category"] || "").toLowerCase();
let bestFor = (seller["Best For"] || "").toLowerCase();

if(category.includes(selectedCategory.toLowerCase())) score += 50;
if(bestFor.includes(selectedOccasion.toLowerCase())) score += 30;

return score;
}

function renderSellers(){

const container = document.getElementById("sellerContainer");

let sellers = globalData.filter(s => 
  (s["Approved"] || "").toLowerCase() === "yes"
);

if(flowActive){
  sellers = sellers
    .map(s => ({...s, score: getMatchScore(s)}))
    .filter(s => s.score > 0)
    .sort((a,b) => b.score - a.score);
}

container.innerHTML = "";

if(flowActive && sellers.length > 0){

let best = sellers[0];

container.innerHTML += `
<div style="background:#fff; padding:20px; border-radius:12px; margin-bottom:20px; border:2px solid #1F7A63;">

<div style="font-weight:bold;">🎯 Best match for you</div>

<div style="margin-top:10px; font-weight:bold;">
${best["Business Name"]}
</div>

<div style="font-size:13px; color:#666;">
${best["Category"]}
</div>

<div style="margin-top:10px;">
💡 ${best["Best For"] || "Popular choice"}
</div>

<div style="margin-top:10px; color:#1F7A63;">
🔥 ${best.score}% Match
</div>

<div style="margin-top:12px;">
<a class="ctaButton"
href="seller.html?name=${encodeURIComponent(best["Business Name"])}">
💬 Chat on WhatsApp
</a>
</div>

</div>
`;

sellers = sellers.slice(1);
}

sellers.forEach(seller => {

container.innerHTML += `
<div class="sellerCard">

<div class="sellerTop">
<img src="${seller["Logo"] || "https://via.placeholder.com/40"}" class="sellerLogo">

<div>
<div class="sellerName">${seller["Business Name"]}</div>
<div class="categoryLabel">${seller["Category"]}</div>
</div>
</div>

<div class="bestFor">
💡 ${seller["Best For"] || "Popular choice"}
</div>

<div style="margin-top:10px;">
<a class="ctaButton"
href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
💬 Chat
</a>
</div>

</div>
`;
});

}

fetch(url)
.then(res => res.json())
.then(data => {
globalData = data;
renderFlow();
renderSellers();
});

</script>

</body>
</html>
