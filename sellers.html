<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<link rel="icon" href="/favicon.png">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f7f6;
}

.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navContainer{
display:flex;
gap:30px;
align-items:center;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

#sellerContainer{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.sellerCard{
background:white;
padding:14px;
border-radius:10px;
}

.sellerTop{
display:flex;
gap:10px;
align-items:center;
}

.sellerLogo{
width:40px;
height:40px;
border-radius:50%;
}

.sellerName{
font-weight:bold;
}

.cardActions{
display:flex;
justify-content:space-between;
margin-top:10px;
}

.viewButton{
background:#1F7A63;
color:white;
padding:6px 12px;
border-radius:6px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">
<h2>All Sellers</h2>
<div id="sellerContainer"></div>
</div>

<script>

const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

function safe(val){
return (val || "").toString().trim();
}

function clean(val){
return safe(val).toLowerCase();
}

fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("sellerContainer");

if(!data || data.length === 0){
container.innerHTML = "<p>No data found</p>";
return;
}

data.forEach(seller => {

try{

// ✅ Skip if not approved
if(clean(seller["Approved"]) !== "yes") return;

// ✅ Skip broken rows
if(!seller["Business Name"]) return;

// SAFE VALUES
let name = safe(seller["Business Name"]);
let category = safe(seller["Category"]);
let logo = safe(seller["Logo"]) || "https://via.placeholder.com/40";
let instagram = safe(seller["Instagram Link"]);

// RENDER
container.innerHTML += `
<div class="sellerCard">

<div class="sellerTop">
<img src="${logo}" class="sellerLogo">

<div>
<div class="sellerName">${name}</div>
<div style="font-size:12px;color:#777;">${category}</div>
</div>
</div>

<div class="cardActions">
${instagram ? `
<a href="${instagram}" target="_blank">Instagram</a>` : ""}

<a class="viewButton" href="seller.html?name=${encodeURIComponent(name)}">
View
</a>

</div>

</div>
`;

}catch(err){
console.log("Skipping broken row", err);
}

});

})
.catch(err => {
document.getElementById("sellerContainer").innerHTML =
"<p>Error loading data</p>";
console.error(err);
});

</script>

</body>
</html>
