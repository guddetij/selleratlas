<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Browse Sellers - SellerAtlas</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f7f6;
}

/* NAVBAR */
.navContainer{
max-width:1200px;
margin-left:0;
margin-right:auto;
padding-left:20px;
display:flex;
align-items:center;
gap:30px;
}

.navbar{
background:#1F7A63;
padding:14px 30px;
}

.navLinks{
display:flex;
gap:25px;
}

.navLinks a{
color:white;
text-decoration:none;
font-weight:600;
}

.logo{
height:38px;
}

/* PAGE */
.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

/* CATEGORY SECTION (FIXED VISIBILITY) */
#categoryContainer{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
margin-bottom:25px; /* IMPORTANT spacing */
}

.category{
background:white;
padding:8px 14px;
border-radius:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
cursor:pointer;
font-size:13px;
white-space:nowrap;
transition:0.2s;
}

.category:hover{
background:#1F7A63;
color:white;
}

/* SEARCH */
.searchBox{
margin-top:10px;
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

/* SELLER GRID */
#sellerContainer{
display:grid;
grid-template-columns: repeat(2, 1fr);
gap:15px;
}

/* CARD */
.sellerCard{
background:white;
padding:14px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
justify-content:space-between;
transition:0.2s;
}

.sellerCard:hover{
transform:translateY(-2px);
}

/* TOP SECTION */
.sellerTop{
display:flex;
gap:10px;
align-items:center;
}

.sellerLogo{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
}

.sellerName{
font-size:16px;
font-weight:bold;
}

.categoryLabel{
font-size:11px;
color:#8FB339;
font-weight:bold;
}

/* INFO */
.sellerHint{
font-size:12px;
color:#555;
margin-top:5px;
}

/* ACTIONS */
.cardActions{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
}

.iconButton{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#f1f1f1;
}

.iconButton img{
width:18px;
height:18px;
}

.viewButton{
background:#1F7A63;
color:white;
padding:7px 14px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* FOOTER */
footer{
margin-top:60px;
padding:20px;
background:#1F7A63;
color:white;
text-align:center;
}

/* MOBILE */
@media (max-width:768px){

#sellerContainer{
grid-template-columns: 1fr;
}

.navContainer{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

}

</style>
</head>

<body>

<header class="navbar">
<div class="navContainer">
<a href="/"><img src="/logo.png" class="logo"></a>
<nav class="navLinks">
<a href="/">Home</a>
<a href="/sellers.html">Browse Sellers</a>
<a href="/submit.html">List Your Business</a>
</nav>
</div>
</header>

<div class="container">

<h2>Browse Categories</h2>
<div id="categoryContainer"></div>
  
<h2 style="margin-top:20px;">All Sellers</h2>

<div class="searchBox">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchSellers()">
</div>

<div id="sellerContainer"></div>

</div>

<footer>
<p>SellerAtlas © 2026</p>
</footer>

<script>

/* SEARCH */
function searchSellers(){
let input = document.getElementById("searchInput").value.toLowerCase();
let sellers = document.getElementsByClassName("sellerCard");

for(let i=0;i<sellers.length;i++){
let text = sellers[i].innerText.toLowerCase();
sellers[i].style.display = text.includes(input) ? "" : "none";
}
}

/* FETCH */
const sheetID = "1rJc2bltxs2wfYAq0RLPBfrjUfauaTi8Go6PYghvlT-Q";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

function clean(val){
return (val || "").toString().trim().toLowerCase();
}

fetch(url)
.then(res => res.json())
.then(data => {

const sellerContainer = document.getElementById("sellerContainer");
const categoryContainer = document.getElementById("categoryContainer");

let categories = new Set();
data.forEach(seller => {

if(clean(seller["Approved"]) !== "yes") return;

if(seller["Category"]){
  categories.add(seller["Category"]);
}

// ADD "All" button
categoryContainer.innerHTML += `
<div class="category" onclick="window.location='sellers.html'">
All
</div>
`;

// ADD CATEGORY BUTTONS
categories.forEach(cat => {
  categoryContainer.innerHTML += `
  <div class="category" onclick="window.location='sellers.html?category=${encodeURIComponent(cat)}'">
    ${cat}
  </div>
  `;
});

let logo = seller["Logo"] || "https://via.placeholder.com/50";

let instagram = seller["Instagram Link"];
let website = seller["Website"];

sellerContainer.innerHTML += `
<div class="sellerCard">

  <div class="sellerTop">
    <img src="${logo}" class="sellerLogo">

    <div>
      <div class="sellerName">${seller["Business Name"]}</div>
      <div class="categoryLabel">${seller["Category"] || ""}</div>
    </div>
  </div>

  <div class="sellerHint">
    View pricing • COD • returns • shipping →
  </div>

  <div class="cardActions">
    ${instagram ? `
      <a href="${instagram}" target="_blank" class="iconButton">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
      </a>
    ` : ""}

    <a class="viewButton" href="seller.html?name=${encodeURIComponent(seller["Business Name"])}">
      View Details
    </a>
  </div>

</div>
`;
});

});

</script>

</body>
</html>
