<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sellers</title>

<style>
body{font-family:Arial;background:#f4f7f6;margin:0;}
.container{max-width:1000px;margin:auto;padding:30px;}
#sellerContainer{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
.sellerCard{background:white;padding:15px;border-radius:10px;}
.sellerTop{display:flex;gap:10px;align-items:center;}
.sellerLogo{width:40px;height:40px;border-radius:50%;}
.viewButton{background:#1F7A63;color:white;padding:6px 10px;text-decoration:none;border-radius:5px;}
</style>

</head>

<body>

<div class="container">
<h2>All Sellers</h2>
<div id="sellerContainer"></div>
</div>

<script>

const url = "https://opensheet.elk.sh/17A0iSszEqDQydQX4nLY51Lua6lJprBx7X_3kV59h4n8/Sheet1";

function clean(val){
return (val || "")
.toString()
.replace(/\r/g,"")
.replace(/\n/g,"")
.trim();
}

fetch(url)
.then(res => res.json())
.then(data => {

const container = document.getElementById("sellerContainer");

if(!data || data.length === 0){
container.innerHTML = "<p>No data found</p>";
return;
}

data.forEach(seller => {

try{

let approved = clean(seller["Approved"]).toLowerCase();
if(approved !== "yes") return;

let name = clean(seller["Business Name"]);
if(!name) return;

let category = clean(seller["Category"]);
let logo = clean(seller["Logo"]) || "https://via.placeholder.com/40";
let instagram = clean(seller["Instagram Link"]);

container.innerHTML += `
<div class="sellerCard">

<div class="sellerTop">
<img src="${logo}" class="sellerLogo">
<div>
<div><strong>${name}</strong></div>
<div style="font-size:12px;color:#777;">${category}</div>
</div>
</div>

<div style="margin-top:10px;display:flex;justify-content:space-between;">

${instagram ? `<a href="${instagram}" target="_blank">Instagram</a>` : ""}

<a class="viewButton" href="seller.html?name=${encodeURIComponent(name)}">
View
</a>

</div>

</div>
`;

}catch(e){
console.log("Skipping row", e);
}

});

});

</script>

</body>
</html>
